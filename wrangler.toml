name = "xaverric-blog"
main = "src/index.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "blog.xaverric.cz", custom_domain = true }]
workers_dev = false
preview_urls = false

[build]
command = "npm run build"
watch_dir = ["client", "shared"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "xaverric-blog"
database_id = "7fe36508-ef49-4be6-bc48-c72b64623168"
migrations_dir = "migrations"

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "3001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "3002"
simple = { limit = 300, period = 60 }

[observability]
enabled = true

[vars]
APP_URL = "https://blog.xaverric.cz"
GITHUB_CLIENT_ID = "Ov23liZb4HCufohBM0Ey"
